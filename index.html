    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --accent: #3182ce;
            --accent-light: #4299e1;
            --success: #38a169;
            --danger: #e53e3e;
            --text: #1a202c;
            --text-light: #4a5568;
            --text-lighter: #595f6d;
            --bg: #ffffff;
            --bg-alt: #f7fafc;
            --bg-dark: #edf2f7;
            --border: #e2e8f0;
        }
        .skip-link {
            position: absolute;
            top: -100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 0 0 8px 8px;
            z-index: 10000;
            font-weight: 600;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Heebo', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
        }
        body.loading .dynamic-content { opacity: 0; }
        body:not(.loading) .dynamic-content { opacity: 1; transition: opacity 0.3s ease; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        header {
            position: fixed;
            top: 0; right: 0; left: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo { text-decoration: none; }
        .logo img { height: 200px; width: auto; }
        nav { display: flex; gap: 32px; align-items: center; }
        nav a { color: var(--text-light); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: var(--primary); }
        a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }
        a:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-secondary:hover { background: var(--primary); color: white; }
        .btn-large { padding: 16px 32px; font-size: 1.1rem; }
        .hero {
            padding: 240px 0 100px;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%);
        }
        .hero-content { max-width: 800px; }
        .hero h1 { font-size: 2.75rem; font-weight: 800; line-height: 1.2; color: var(--primary); margin-bottom: 24px; }
        .hero-subtitle { font-size: 1.25rem; color: var(--text-light); margin-bottom: 40px; line-height: 1.8; }
        .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }
        .problem { padding: 100px 0; background: var(--bg); }
        .problem-story { max-width: 800px; margin: 0 auto; text-align: center; }
        .problem-story p { font-size: 1.2rem; color: var(--text-light); margin-bottom: 24px; }
        .problem-story .highlight {
            font-size: 1.5rem; font-weight: 700; color: var(--primary);
            padding: 24px; background: var(--bg-alt); border-radius: 12px;
            border-right: 4px solid var(--accent);
        }
        .solution { padding: 100px 0; background: var(--bg-alt); }
        .section-header { text-align: center; margin-bottom: 64px; }
        .section-header h2 { font-size: 2.25rem; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
        .section-header p { font-size: 1.1rem; color: var(--text-light); max-width: 600px; margin: 0 auto; }
        .intro-box {
            max-width: 800px; margin: 0 auto 64px;
            padding: 40px; background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .intro-box p { font-size: 1.15rem; color: var(--text); margin-bottom: 16px; }
        .intro-box p:last-child { margin-bottom: 0; }
        .comparison { display: grid; grid-template-columns: repeat(2,1fr); gap: 32px; max-width: 900px; margin: 0 auto; }
        .comparison-card { padding: 32px; border-radius: 16px; background: white; }
        .comparison-card.negative { border: 2px solid var(--danger); }
        .comparison-card.positive { border: 2px solid var(--success); }
        .comparison-card h3 { font-size: 1.25rem; margin-bottom: 24px; color: var(--text); }
        .comparison-card ul { list-style: none; }
        .comparison-card li { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; font-size: 1rem; color: var(--text-light); }
        .comparison-card li:last-child { margin-bottom: 0; }
        .icon-x { color: var(--danger); font-weight: bold; flex-shrink: 0; }
        .icon-check { color: var(--success); font-weight: bold; flex-shrink: 0; }
        .process { padding: 100px 0; background: var(--bg); }
        .process-steps { display: flex; flex-direction: column; gap: 48px; }
        .step { display: grid; grid-template-columns: 80px 1fr; gap: 32px; align-items: start; }
        .step-number {
            width: 80px; height: 80px; background: var(--accent); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 800; flex-shrink: 0;
        }
        .step-content { background: var(--bg-alt); padding: 32px; border-radius: 16px; }
        .step-content h3 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; }
        .step-content .step-subtitle { font-size: 1.1rem; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
        .step-content p { color: var(--text-light); margin-bottom: 16px; }
        .step-content ul { list-style: none; margin-bottom: 16px; }
        .step-content li { padding: 8px 0; color: var(--text-light); padding-right: 24px; position: relative; }
        .step-content li::before { content: "•"; color: var(--accent); position: absolute; right: 0; font-weight: bold; }
        .step-result { background: white; padding: 16px 20px; border-radius: 8px; border-right: 3px solid var(--success); color: var(--text); font-weight: 500; }
        .fit { padding: 100px 0; background: var(--bg-alt); }
        .fit-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 48px; }
        .fit-card { background: white; padding: 40px; border-radius: 16px; }
        .fit-card h3 { font-size: 1.5rem; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .fit-card.positive h3 { color: var(--success); }
        .fit-card.negative h3 { color: var(--danger); }
        .fit-card ul { list-style: none; }
        .fit-card li { padding: 12px 0; border-bottom: 1px solid var(--border); color: var(--text-light); }
        .fit-card li:last-child { border-bottom: none; }
        .why { padding: 100px 0; background: var(--primary); color: white; }
        .why .section-header h2 { color: white; }
        .why .section-header p { color: rgba(255,255,255,0.8); }
        .why-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 32px; }
        .why-card { background: rgba(255,255,255,0.1); padding: 32px; border-radius: 16px; text-align: center; }
        .why-card h3 { font-size: 1.25rem; margin-bottom: 16px; color: var(--accent-light); }
        .why-card p { color: rgba(255,255,255,0.9); line-height: 1.8; }
        .cta { padding: 100px 0; background: var(--bg); }
        .cta-box { max-width: 800px; margin: 0 auto; text-align: center; background: var(--bg-alt); padding: 64px; border-radius: 24px; }
        .cta-box h2 { font-size: 2.25rem; color: var(--primary); margin-bottom: 24px; }
        .cta-box > p { font-size: 1.15rem; color: var(--text-light); margin-bottom: 32px; }
        .cta-benefits { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; text-align: right; margin-bottom: 40px; }
        .cta-benefit { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: white; border-radius: 8px; }
        .cta-benefit .icon-check { font-size: 1.25rem; }
        .cta-closing { font-size: 1.15rem; color: var(--text-light); margin-bottom: 32px; }
        .trifold { padding: 80px 0; background: var(--bg-alt); }
        .trifold-content { max-width: 800px; margin: 0 auto; text-align: center; }
        .trifold-content h2 { font-size: 1.75rem; color: var(--primary); margin-bottom: 24px; }
        .trifold-content p { color: var(--text-light); margin-bottom: 16px; font-size: 1.1rem; }
        .trifold-pillars { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin: 40px 0; }
        .pillar { background: white; padding: 24px; border-radius: 12px; border-top: 4px solid var(--accent); }
        .pillar h4 { color: var(--primary); margin-bottom: 8px; }
        .pillar p { font-size: 0.95rem; margin-bottom: 0; }
        .trifold-tagline { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-top: 24px; }
        .a11y-statement { padding: 80px 0; background: var(--bg); }
        .a11y-statement-content { max-width: 800px; margin: 0 auto; }
        .a11y-statement-content h2 { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 24px; text-align: center; }
        .a11y-statement-content h3 { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-top: 32px; margin-bottom: 12px; }
        .a11y-statement-content p { color: var(--text-light); margin-bottom: 16px; line-height: 1.8; }
        .a11y-statement-content ul { list-style: none; margin-bottom: 20px; }
        .a11y-statement-content li { padding: 6px 0; padding-right: 24px; position: relative; color: var(--text-light); line-height: 1.8; }
        .a11y-statement-content li::before { content: "✓"; color: var(--success); position: absolute; right: 0; font-weight: bold; }
        .a11y-contact-box { background: var(--bg-alt); border-radius: 12px; padding: 24px 32px; margin-top: 24px; border-right: 4px solid var(--accent); }
        .a11y-contact-box p { margin-bottom: 8px; }
        .a11y-contact-box a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .a11y-contact-box a:hover { text-decoration: underline; }
        .a11y-update-date { font-size: 0.9rem; color: var(--text-lighter); margin-top: 24px; text-align: center; }
        .legal-section { padding: 80px 0 60px; background: var(--bg); border-top: 1px solid var(--border); }
        .legal-content { max-width: 800px; margin: 0 auto; }
        .legal-content h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 24px; text-align: center; }
        .legal-content h3 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 28px; margin-bottom: 10px; }
        .legal-content p { color: var(--text-light); margin-bottom: 14px; line-height: 1.9; }
        .legal-content ul { list-style: none; margin-bottom: 16px; }
        .legal-content li { padding: 4px 0; padding-right: 22px; position: relative; color: var(--text-light); line-height: 1.8; }
        .legal-content li::before { content: "•"; color: var(--accent); position: absolute; right: 0; font-weight: bold; }
        .legal-update-date { font-size: 0.9rem; color: var(--text-lighter); margin-top: 28px; text-align: center; }
        footer { background: var(--primary); color: white; padding: 64px 0 32px; }
        .footer-content { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 48px; }
        .footer-info h3 { font-size: 1.5rem; margin-bottom: 8px; }
        .footer-info .tagline { color: var(--accent-light); font-size: 1.1rem; margin-bottom: 24px; }
        .footer-contact { display: flex; flex-direction: column; gap: 12px; }
        .footer-contact a { color: white; text-decoration: none; display: flex; align-items: center; gap: 12px; transition: color 0.2s; }
        .footer-contact a:hover { color: var(--accent-light); }
        .footer-bottom { padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center; color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--primary); }

        /* ===== CLIENTS SECTION ===== */
        .clients {
            background-color: #fff;
            padding: 80px 0;
            text-align: center;
        }
        .clients-section-label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #718096;
            margin-bottom: 12px;
        }
        .clients-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 64px;
            flex-wrap: wrap;
        }
        .client-logo-card {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.2s ease;
        }
        .client-logo-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .client-logo-card img {
            max-height: 60px;
            max-width: 180px;
            width: auto;
            object-fit: contain;
            filter: grayscale(30%);
            transition: filter 0.2s ease;
        }
        .client-logo-card:hover img {
            filter: grayscale(0%);
        }

        /* ===== ABOUT SECTION ===== */
        .about {
            background-color: var(--bg-alt);
            padding: 80px 0;
        }
        .about-inner {
            display: flex;
            gap: 56px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .about-photo { flex: 0 0 220px; }
        .about-photo .profile-photo {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 4px solid var(--accent);
            box-shadow: 0 8px 32px rgba(49,130,206,0.2);
        }
        .about-content { flex: 1; min-width: 280px; }
        .about-content h2 { font-size: 2rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .about-role { font-size: 1.1rem; color: var(--accent); font-weight: 600; margin-bottom: 20px; margin-top: 0; }
        .about-content p { color: var(--text-light); line-height: 1.8; margin-bottom: 16px; font-size: 1.05rem; }
        .btn-linkedin {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #0077b5;
            color: #fff !important;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }
        .btn-linkedin:hover { background-color: #005fa3; color: #fff; }

        @media (max-width: 968px) {
            .hero h1 { font-size: 2.25rem; }
            .comparison { grid-template-columns: 1fr; }
            .fit-grid { grid-template-columns: 1fr; }
            .why-grid { grid-template-columns: 1fr; }
            .trifold-pillars { grid-template-columns: 1fr; }
            .step { grid-template-columns: 1fr; }
            .step-number { width: 60px; height: 60px; font-size: 1.5rem; }
            .cta-benefits { grid-template-columns: 1fr; }
            .footer-content { flex-direction: column; gap: 32px; }
        }
        @media (max-width: 768px) {
            nav {
                display: none;
                position: absolute;
                top: 100%; right: 0; left: 0;
                background: rgba(255,255,255,0.98);
                backdrop-filter: blur(10px);
                flex-direction: column;
                padding: 16px 24px;
                gap: 16px;
                border-bottom: 1px solid var(--border);
                box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            }
            nav.mobile-open { display: flex; }
            .mobile-menu-btn { display: block; }
            .logo img { height: 80px; }
            .hero { padding: 140px 0 80px; }
            .hero h1 { font-size: 1.875rem; }
            .hero-subtitle { font-size: 1.1rem; }
            .hero-cta { flex-direction: column; }
            .hero-cta .btn { width: 100%; justify-content: center; }
            .section-header h2 { font-size: 1.75rem; }
            .cta-box { padding: 40px 24px; }
            .problem, .solution, .process, .fit, .why, .cta { padding: 64px 0; }
            .about-inner { flex-direction: column; align-items: center; text-align: center; }
        }

        /* ===== Accessibility Widget Styles ===== */
        .a11y-trigger {
            position: fixed; bottom: 24px; left: 24px;
            width: 56px; height: 56px;
            background: var(--accent); color: white;
            border: none; border-radius: 50%;
            cursor: pointer; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            font-size: 1.6rem; line-height: 1;
        }
        .a11y-trigger:hover { transform: scale(1.1); background: var(--primary-light); }
        .a11y-trigger:focus { outline: 3px solid var(--accent-light); outline-offset: 2px; }
        .a11y-trigger svg { width: 28px; height: 28px; fill: currentColor; }
        .a11y-panel {
            position: fixed; bottom: 90px; left: 24px;
            width: 320px; max-height: 80vh;
            background: white; border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            z-index: 9998; display: none; flex-direction: column;
            overflow: hidden; direction: rtl;
        }
        .a11y-panel.open { display: flex; }
        .a11y-panel-header { background: var(--primary); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .a11y-panel-header h3 { font-size: 1.1rem; margin: 0; }
        .a11y-panel-close { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; padding: 0; line-height: 1; }
        .a11y-panel-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .a11y-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: var(--bg-alt);
            border: 2px solid transparent; border-radius: 10px;
            cursor: pointer; font-family: inherit; font-size: 0.95rem;
            font-weight: 500; color: var(--text);
            transition: all 0.15s; text-align: right;
        }
        .a11y-btn:hover { border-color: var(--accent); background: #ebf8ff; }
        .a11y-btn.active { border-color: var(--accent); background: #ebf8ff; }
        .a11y-btn .a11y-icon { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
        .a11y-reset {
            margin-top: 6px; padding: 10px;
            background: none; border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; font-family: inherit; font-size: 0.9rem; color: var(--text-light);
            transition: all 0.15s;
        }
        .a11y-reset:hover { background: #fed7d7; color: var(--danger); border-color: var(--danger); }
        body.a11y-large-text { font-size: 120% !important; }
        body.a11y-xlarge-text { font-size: 140% !important; }
