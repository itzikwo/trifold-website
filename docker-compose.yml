services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trifold-website
    restart: unless-stopped
    ports:
      # External (host bridge 172.17.0.1) : Internal (container nginx port 80)
      # The reverse proxy in elest.io targets 172.17.0.1:3000
      - "3000:80"
    healthcheck:
      # nginx:alpine ships BusyBox wget (no curl). Use a plain GET discarded to
      # /dev/null instead of --spider (unreliable in BusyBox), and force IPv4 via
      # 127.0.0.1 — `localhost` can resolve to ::1, which `listen 80;` doesn't bind.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
