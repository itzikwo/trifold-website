<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - הדף לא נמצא | TriFold Technologies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #1a365d;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.75rem;
            color: #1a365d;
            margin-bottom: 16px;
        }
        p {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #3182ce;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #2c5282;
            transform: translateY(-2px);
        }
        .logo {
            margin-top: 48px;
            font-size: 1.25rem;
            font-weight: 800;
            color: #1a365d;
        }
        .logo span {
            color: #3182ce;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>הדף לא נמצא</h1>
        <p>מצטערים, הדף שחיפשתם לא קיים או שהועבר למקום אחר.</p>
        <a href="/" class="btn">חזרה לדף הבית</a>
        <div class="logo">Tri<span>Fold</span></div>
    </div>
</body>
</html>
